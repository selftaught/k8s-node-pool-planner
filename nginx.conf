# no-cache makes Cloudflare and browsers revalidate, so a redeploy shows up at once instead of
# serving the previous build's files from the edge.
server {
	listen 8080;
	root /usr/share/nginx/html;
	index index.html;
	# index.html loads the JS from /v<epoch>/ to bust caches; serve those from the root.
	rewrite ^/v[0-9]+(/.*)$ $1 last;
	location / {
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri/ =404;
	}
}
