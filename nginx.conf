# no-cache makes Cloudflare and browsers revalidate, so a redeploy shows up at once instead of
# serving the previous build's files from the edge.
server {
	listen 8080;
	root /usr/share/nginx/html;
	index index.html;
	location / {
		add_header Cache-Control "no-cache" always;
		try_files $uri $uri/ =404;
	}
}
